[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.23.1"

[[redirects]]
  from = "/scorepad"
  to = "/etc/scorepad"
  status = 301
  force = true

[[redirects]]
  from = "/astronomy-buddy"
  to = "/etc/astronomy-buddy"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
